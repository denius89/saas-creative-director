name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: figma-plugin/package-lock.json
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify core workflow
        run: |
          ./scripts/test.sh
          ./scd health-check
          ./scd validate examples/ledgerly
      - name: Verify bundled Figma importer
        working-directory: figma-plugin
        run: |
          npm ci
          npm run check-dist
          npm test
