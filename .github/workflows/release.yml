name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify version and tests
        run: |
          test "v$(cat core/VERSION)" = "$GITHUB_REF_NAME"
          ./scripts/test.sh
          ./scd health-check
          ./scd validate examples/ledgerly
      - name: Build release asset
        run: python scripts/build_release.py dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
