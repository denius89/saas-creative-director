<!doctype html>
<html>
  <body style="font: 12px Inter, sans-serif; margin: 16px">
    <h2>Import storyboard wireframes</h2>
    <p>Select the manifest generated by <code>./scd figma-manifest</code>.</p>
    <input id="file" type="file" accept="application/json,.json" />
    <p id="status"></p>
    <script>
      document.getElementById('file').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const manifest = JSON.parse(await file.text());
          parent.postMessage({ pluginMessage: { type: 'import', manifest } }, '*');
          document.getElementById('status').textContent = 'Importing…';
        } catch (error) {
          document.getElementById('status').textContent = `Invalid JSON: ${error.message}`;
        }
      });
      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message?.type === 'done') document.getElementById('status').textContent = `Created ${message.count} frames.`;
        if (message?.type === 'error') document.getElementById('status').textContent = message.message;
      };
    </script>
  </body>
</html>
