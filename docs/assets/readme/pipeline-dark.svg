<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SaaS Creative Director pipeline</title>
  <desc id="desc">Five stages connect product evidence to a production handoff, with human approvals after strategy, creative direction, and production review.</desc>
  <rect width="1200" height="320" rx="26" fill="#0B1020"/>
  <text x="48" y="50" fill="#F9FAFB" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">One controlled path from brief to handoff</text>
  <text x="48" y="77" fill="#9CA3AF" font-family="Inter,Arial,sans-serif" font-size="14">Automation prepares decisions. People approve the moments that change the work.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(48 112)"><rect width="190" height="112" rx="18" fill="#161B27" stroke="#374151"/><text x="20" y="35" fill="#A5B4FC" font-size="12" font-weight="700">01 · GROUND TRUTH</text><text x="20" y="65" fill="#F9FAFB" font-size="18" font-weight="700">Brief + product</text><text x="20" y="88" fill="#9CA3AF" font-size="13">Evidence and JTBD</text></g>
    <path d="M246 168H266" stroke="#6B7280" stroke-width="2"/><path d="M260 162L268 168L260 174" fill="none" stroke="#6B7280" stroke-width="2"/>
    <g transform="translate(276 112)"><rect width="190" height="112" rx="18" fill="#161B27" stroke="#374151"/><text x="20" y="35" fill="#A5B4FC" font-size="12" font-weight="700">02 · STRATEGY</text><text x="20" y="65" fill="#F9FAFB" font-size="18" font-weight="700">Reason to watch</text><text x="20" y="88" fill="#9CA3AF" font-size="13">Audience + value</text></g>
    <path d="M474 168H494" stroke="#6B7280" stroke-width="2"/><path d="M488 162L496 168L488 174" fill="none" stroke="#6B7280" stroke-width="2"/>
    <g transform="translate(504 112)"><rect width="190" height="112" rx="18" fill="#161B27" stroke="#818CF8" stroke-width="2"/><text x="20" y="35" fill="#A5B4FC" font-size="12" font-weight="700">03 · DIRECTION</text><text x="20" y="65" fill="#F9FAFB" font-size="18" font-weight="700">Narrative + motion</text><text x="20" y="88" fill="#9CA3AF" font-size="13">References + grammar</text></g>
    <path d="M702 168H722" stroke="#6B7280" stroke-width="2"/><path d="M716 162L724 168L716 174" fill="none" stroke="#6B7280" stroke-width="2"/>
    <g transform="translate(732 112)"><rect width="190" height="112" rx="18" fill="#F9FAFB"/><text x="20" y="35" fill="#4F46E5" font-size="12" font-weight="700">04 · STORYBOARD</text><text x="20" y="65" fill="#111827" font-size="18" font-weight="700">Scenes + timing</text><text x="20" y="88" fill="#6B7280" font-size="13">Visual QA</text></g>
    <path d="M930 168H950" stroke="#6B7280" stroke-width="2"/><path d="M944 162L952 168L944 174" fill="none" stroke="#6B7280" stroke-width="2"/>
    <g transform="translate(960 112)"><rect width="190" height="112" rx="18" fill="#161B27" stroke="#374151"/><text x="20" y="35" fill="#A5B4FC" font-size="12" font-weight="700">05 · HANDOFF</text><text x="20" y="65" fill="#F9FAFB" font-size="18" font-weight="700">Editable Figma</text><text x="20" y="88" fill="#9CA3AF" font-size="13">Production notes</text></g>
    <g transform="translate(312 244)"><rect width="118" height="34" rx="17" fill="#073B34"/><circle cx="18" cy="17" r="5" fill="#34D399"/><text x="32" y="22" fill="#6EE7B7" font-size="12" font-weight="700">GATE 1</text></g>
    <g transform="translate(540 244)"><rect width="118" height="34" rx="17" fill="#252450"/><circle cx="18" cy="17" r="5" fill="#818CF8"/><text x="32" y="22" fill="#C7D2FE" font-size="12" font-weight="700">GATE 2</text></g>
    <g transform="translate(996 244)"><rect width="118" height="34" rx="17" fill="#073B34"/><circle cx="18" cy="17" r="5" fill="#34D399"/><text x="32" y="22" fill="#6EE7B7" font-size="12" font-weight="700">GATE 3</text></g>
  </g>
</svg>
