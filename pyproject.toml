[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-creative-director"
version = "0.7.0"
description = "Evidence-backed creative pre-production for SaaS video"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SaaS Creative Director contributors"}]
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scd = "saas_creative_director.cli:main"

[tool.setuptools.packages.find]
where = ["core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core/src"]
